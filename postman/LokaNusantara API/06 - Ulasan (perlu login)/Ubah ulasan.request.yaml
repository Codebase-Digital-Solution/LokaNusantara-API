$kind: http-request
url: "{{baseUrl}}/api/v1/reviews/{{reviewId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rating": 4,
      "comment": "Pengalaman yang menyenangkan."
    }
auth:
  type: bearer
  credentials:
    token: "{{jwt_token}}"
order: 3000
