$kind: http-request
description: Membuat akun user. Token dari respons disimpan otomatis ke collection variable jwt_token.
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Nama Pengguna",
      "email": "user@example.com",
      "password": "password123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const data = pm.response.json();
      if (data && data.token) { pm.environment.set("jwt_token", data.token); pm.collectionVariables.set("jwt_token", data.token); }
      if (data && data.id) { pm.environment.set("userId", data.id); pm.collectionVariables.set("userId", data.id); }
    language: text/javascript
order: 2000
