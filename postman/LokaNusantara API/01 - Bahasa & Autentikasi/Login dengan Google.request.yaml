$kind: http-request
description: Memerlukan Google ID token yang audience-nya terdaftar di konfigurasi server.
url: "{{baseUrl}}/api/v1/auth/google"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_token": "{{googleIdToken}}"
    }
auth:
  type: noauth
order: 4000
