$kind: http-request
url: "{{baseUrl}}/api/v1/locations/{{locationId}}?lang=id&include_translations=true"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Pura Contoh",
      "description": "Deskripsi singkat tempat.",
      "history": "Riwayat tempat.",
      "address": "Bali, Indonesia",
      "latitude": -8.6705,
      "longitude": 115.2126,
      "category_id": {{categoryId}},
      "image_url": "",
      "translations": {
        "id": {
          "name": "Pura Contoh",
          "description": "Deskripsi singkat tempat.",
          "history": "Riwayat tempat.",
          "address": "Bali, Indonesia"
        },
        "en": {
          "name": "Example Temple",
          "description": "A brief description.",
          "history": "Historical background.",
          "address": "Bali, Indonesia"
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{jwt_token}}"
order: 2000
